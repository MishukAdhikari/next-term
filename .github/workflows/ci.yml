name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # build number = commit count

      - name: Toolchain
        run: swift --version

      - name: No website in this repository
        run: |
          # The website and its notes live in a private repository; only the installer (scripts/install.sh) is here.
          if [[ -n "$(git ls-files site claudedocs)" ]]; then echo "::error::site/ or claudedocs/ is tracked again"; git ls-files site claudedocs | head; exit 1; fi

      - name: Unit tests
        timeout-minutes: 20 # about 8 minutes on a slow runner (October 2026), 5 on a fast one
        run: |
          # If the run stalls, show what is still running (test output is buffered until the end).
          ( sleep 420; echo "::group::Still running after 7 minutes"; ps -axo pid,ppid,stat,etime,command | grep -E "git|swiftpm|xctest|NextTerm" | grep -v grep; echo "::endgroup::" ) &
          scripts/test.sh

      - name: zsh integration test
        timeout-minutes: 15 # about 5 minutes on a fast Mac since Tab completion's going-into-folders checks
        # No retry: each answered Tab now sends its answer with the key, so a busy runner can't make it miss zsh's
        # 150 ms window, and a failure here is a real one.
        run: python3 -u scripts/zsh-integration-test.py

      - name: Build DMG
        timeout-minutes: 40 # two release builds (arm64, x86_64): about 22 minutes on a slow runner, 13 on a fast one
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="0.0.0-dev"
          VERSION="$VERSION" scripts/build-dmg.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NextTerm-dmg
          path: |
            dist/*.dmg
            dist/*.sha256

      # The app's symbols, for crash reports (scripts/build-dmg.sh strips them from the app).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NextTerm-dSYM
          path: dist/*.dSYM

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # only this job can publish
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: NextTerm-dmg
          path: dist
      - name: Add version-less copies (the website downloads releases/latest/download/NextTerm.dmg)
        run: |
          cd dist
          cp NextTerm-*.dmg NextTerm.dmg
          sha256sum NextTerm.dmg > NextTerm.dmg.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Next Term $GITHUB_REF_NAME" --generate-notes
