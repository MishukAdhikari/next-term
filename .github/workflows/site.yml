name: Site

# Builds and checks the website in site/ on every change to it. Deploying is done separately.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/site.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # "Last updated" dates come from git history

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: |
          npm run build 2>&1 | tee build.log
          if grep -E "\[WARN\]|\[ERROR\]" build.log; then echo "::error::The build printed warnings"; exit 1; fi

      - name: Check links, HTML, structured data, sitemap and typography
        run: npm run check

      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
          retention-days: 7
