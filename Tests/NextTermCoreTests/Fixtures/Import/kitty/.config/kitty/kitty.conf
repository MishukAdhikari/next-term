# kitty.conf, written by hand for the import tests (never copied from a real Mac).

font_family      family="JetBrains Mono" style=Regular
font_size        13.0
cursor_shape     beam
cursor_blink_interval 0 ease-in-out
scrollback_lines -1
macos_option_as_alt left
background_opacity 0.92
copy_on_select   yes
tab_bar_style    powerline

foreground #dddddd
background #101010
color1     #cc0403
color200   #ffffff
color4     dodgerblue
selection_background none

shell /bin/zsh -c 'export GITHUB_TOKEN=eyJhbGciOiJIUzI1NiJ9.eyJmaXh0dXJlIjoic2VjcmV0In0.bm90LWEtcmVhbC1zaWduYXR1cmU; exec zsh'
env OPENAI_API_KEY=FixtureSecretAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
remote_control_password "FixtureSecretAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" set-colors
startup_session session.conf

include current-theme.conf
globinclude kitty.d/**/*.conf
include ../../outside.conf
include ${HOME}/elsewhere.conf
include escape.conf
include missing.conf
geninclude dynamic.py
envinclude KITTY_CONF_*

kitty_mod cmd+shift
map kitty_mod+t new_tab_with_cwd
map cmd+d launch --location=vsplit --cwd=current
map cmd+shift+d launch --cwd current --location hsplit
map cmd+e launch --location=vsplit htop
map cmd+k clear_terminal to_cursor active
map ctrl+a>c new_tab
map cmd+1 goto_tab 1
map --when-focus-on title:vim cmd+s next_tab
map cmd+f send_text all FixtureSecretAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
map cmd+enter toggle_layout stack
map cmd+shift+w close_os_window
map kitty_mod+left neighboring_window left
map ctrl+shift+c copy_to_clipboard
map cmd+w close_window
map cmd+w
map cmd+plus change_font_size all +2.0
map cmd+opt+equal change_font_size all +2.0
